<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="오늘 할 일을 정리하고 완료율을 확인하는 To-Do 리스트" />
    <title>오늘의 할 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="오늘의 할 일 홈">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <span>daylist</span>
        </a>
        <span class="date-label" id="todayLabel"></span>
      </header>

      <main class="dashboard">
        <section class="intro" aria-labelledby="pageTitle">
          <p class="eyebrow">YOUR DAILY SPACE</p>
          <h1 id="pageTitle">오늘의 할 일<span class="accent-dot">.</span></h1>
          <p class="intro-copy">작은 체크 하나가 오늘을 앞으로 데려가요.</p>
        </section>

        <section class="progress-panel" aria-labelledby="progressHeading">
          <div class="progress-heading">
            <div>
              <p class="section-kicker">PROGRESS</p>
              <h2 id="progressHeading"><span id="completedCount">0</span> / <span id="totalCount">0</span> 완료</h2>
            </div>
            <strong class="progress-percent" id="progressPercent">0%</strong>
          </div>
          <div class="progress-track" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </section>

        <section class="todo-section" aria-labelledby="listHeading">
          <div class="section-header">
            <div>
              <p class="section-kicker">TASKS</p>
              <h2 id="listHeading">할 일 목록</h2>
            </div>
            <span class="task-count" id="visibleCount">0 tasks</span>
          </div>

          <form class="add-form" id="todoForm">
            <label class="sr-only" for="todoInput">새 할 일</label>
            <input id="todoInput" name="todo" type="text" maxlength="120" placeholder="새로운 할 일을 적어보세요" autocomplete="off" required />
            <button class="add-button" type="submit" aria-label="할 일 추가">추가 <span aria-hidden="true">↗</span></button>
          </form>

          <div class="filter-tabs" role="tablist" aria-label="할 일 필터">
            <button class="filter-tab is-active" type="button" role="tab" aria-selected="true" data-filter="all">전체</button>
            <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="active">진행 중</button>
            <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="completed">완료됨</button>
          </div>

          <div class="todo-list" id="todoList" aria-live="polite"></div>
          <div class="empty-state" id="emptyState" hidden>
            <span class="empty-icon" aria-hidden="true">✦</span>
            <h3 id="emptyTitle">아직 할 일이 없어요</h3>
            <p id="emptyCopy">위 입력창에 오늘의 첫 할 일을 추가해보세요.</p>
          </div>
        </section>
      </main>

      <footer class="footer-note">목록은 이 브라우저에 자동으로 저장됩니다.</footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>

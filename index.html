<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do 리스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 min-h-screen bg-gray-100 text-gray-800 font-sans flex justify-center p-6 sm:p-10">
  <div class="w-full max-w-[480px] bg-white rounded-2xl p-6 shadow-lg shadow-black/5">
    <h1 class="m-0 mb-5 text-2xl font-bold text-center">To-Do 리스트</h1>

    <form id="todo-form" class="flex gap-2 mb-5">
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
        maxlength="200"
        class="flex-1 px-3 py-2.5 border border-gray-200 rounded-lg text-[0.95rem] focus:outline-none focus:border-indigo-600"
      />
      <button
        type="submit"
        class="px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold cursor-pointer hover:bg-indigo-700 transition-colors"
      >추가</button>
    </form>

    <div class="mb-5">
      <div class="text-sm text-gray-500 mb-1.5">
        <span id="progress-count">0 / 0 완료</span>
      </div>
      <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
        <div id="progress-fill" class="h-full w-0 bg-indigo-600 transition-[width] duration-200 ease-in-out"></div>
      </div>
    </div>

    <div class="flex gap-1 mb-4 bg-gray-100 p-1 rounded-lg" role="tablist">
      <button class="filter-tab flex-1 py-2 rounded-md text-sm cursor-pointer border-none bg-white text-indigo-600 font-semibold shadow-sm transition-colors" data-filter="all" role="tab" aria-selected="true">전체</button>
      <button class="filter-tab flex-1 py-2 rounded-md text-sm cursor-pointer border-none bg-transparent text-gray-500 transition-colors" data-filter="active" role="tab" aria-selected="false">진행 중</button>
      <button class="filter-tab flex-1 py-2 rounded-md text-sm cursor-pointer border-none bg-transparent text-gray-500 transition-colors" data-filter="completed" role="tab" aria-selected="false">완료됨</button>
    </div>

    <ul id="todo-list" class="list-none m-0 p-0 flex flex-col gap-2"></ul>

    <p id="empty-state" class="text-center text-gray-500 py-6 text-sm" hidden>표시할 항목이 없습니다.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>

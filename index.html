<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="오늘 할 일을 정리하고 완료율을 확인하는 To-Do 리스트" />
    <title>오늘의 할 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1e2725",
              muted: "#7a8580",
              line: "#dce4df",
              paper: "#f7f9f5",
              mint: "#b8e7c9",
              "mint-deep": "#3f8b62",
              coral: "#ee765e",
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
            },
            boxShadow: {
              soft: "0 18px 50px rgba(48, 70, 57, 0.08)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="m-0 min-h-screen bg-paper bg-[radial-gradient(#d8e7da_0.8px,transparent_0.8px)] bg-[size:22px_22px] font-sans text-ink">
      <div class="mx-auto w-[calc(100%-32px)] max-w-[960px] sm:w-[calc(100%-48px)]">
      <header class="flex h-[72px] items-center justify-between border-b border-line min-[601px]:h-[86px]">
        <a class="inline-flex items-center gap-2.5 font-display text-[19px] font-bold tracking-[-0.04em] text-ink no-underline" href="./" aria-label="오늘의 할 일 홈">
          <span class="grid h-[29px] w-[29px] place-items-center rounded-[9px] bg-mint text-[17px] text-ink" aria-hidden="true">✓</span>
          <span>daylist</span>
        </a>
        <span class="text-[11px] font-semibold tracking-[0.04em] text-muted min-[601px]:text-[13px]" id="todayLabel"></span>
      </header>

      <main class="pb-10 pt-[55px] min-[601px]:pt-[72px]">
        <section class="mb-[34px] min-[601px]:mb-[43px]" aria-labelledby="pageTitle">
          <p class="mb-3 text-[11px] font-bold tracking-[0.17em] text-mint-deep">YOUR DAILY SPACE</p>
          <h1 class="mb-[13px] font-display text-[49px] leading-[0.98] tracking-[-0.08em] min-[601px]:text-[clamp(42px,7vw,72px)]" id="pageTitle">오늘의 할 일<span class="text-coral">.</span></h1>
          <p class="m-0 text-base text-muted">작은 체크 하나가 오늘을 앞으로 데려가요.</p>
        </section>

        <section class="rounded-[10px] border border-line/70 bg-white p-[23px_20px_24px] shadow-soft min-[601px]:p-[28px_30px_30px]" aria-labelledby="progressHeading">
          <div class="flex items-end justify-between gap-5">
            <div>
              <p class="mb-3 text-[11px] font-bold tracking-[0.17em] text-mint-deep">PROGRESS</p>
              <h2 class="m-0 font-display text-[21px] tracking-[-0.055em] min-[601px]:text-2xl" id="progressHeading"><span id="completedCount">0</span> / <span id="totalCount">0</span> 완료</h2>
            </div>
            <strong class="font-display text-[25px] text-mint-deep" id="progressPercent">0%</strong>
          </div>
          <div class="progress-track mt-[22px] h-2.5 overflow-hidden rounded-full bg-[#edf2ed]" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="h-full w-0 rounded-full bg-mint-deep transition-[width] duration-300" id="progressFill"></div>
          </div>
        </section>

        <section class="mt-[52px] min-[601px]:mt-16" aria-labelledby="listHeading">
          <div class="flex items-end justify-between gap-5">
            <div>
              <p class="mb-3 text-[11px] font-bold tracking-[0.17em] text-mint-deep">TASKS</p>
              <h2 class="m-0 font-display text-[21px] tracking-[-0.055em] min-[601px]:text-2xl" id="listHeading">할 일 목록</h2>
            </div>
            <span class="text-[13px] text-muted" id="visibleCount">0 tasks</span>
          </div>

          <form class="mt-[22px] flex gap-2 max-[600px]:gap-[7px]" id="todoForm">
            <label class="sr-only" for="todoInput">새 할 일</label>
            <input class="min-w-0 flex-1 rounded-[7px] border border-line bg-white px-[14px] py-[14px] text-ink outline-none transition focus:border-mint-deep focus:ring-[3px] focus:ring-mint-deep/10 min-[601px]:px-[18px] min-[601px]:py-4" id="todoInput" name="todo" type="text" maxlength="120" placeholder="새로운 할 일을 적어보세요" autocomplete="off" required />
            <button class="rounded-[7px] border-0 bg-ink px-[14px] font-bold text-white transition hover:-translate-y-0.5 hover:bg-mint-deep min-[601px]:px-5" type="submit" aria-label="할 일 추가">추가 <span class="ml-[7px] text-[17px] text-mint" aria-hidden="true">↗</span></button>
          </form>

          <div class="mt-[30px] flex gap-[22px] border-b border-line min-[601px]:mt-9 min-[601px]:gap-[26px]" role="tablist" aria-label="할 일 필터">
            <button class="relative border-0 bg-transparent pb-[14px] text-sm font-semibold text-ink after:absolute after:bottom-[-1px] after:left-0 after:right-0 after:h-0.5 after:bg-coral" type="button" role="tab" aria-selected="true" data-filter="all">전체</button>
            <button class="relative border-0 bg-transparent pb-[14px] text-sm font-semibold text-muted after:absolute after:bottom-[-1px] after:left-0 after:right-0 after:h-0.5 after:bg-transparent" type="button" role="tab" aria-selected="false" data-filter="active">진행 중</button>
            <button class="relative border-0 bg-transparent pb-[14px] text-sm font-semibold text-muted after:absolute after:bottom-[-1px] after:left-0 after:right-0 after:h-0.5 after:bg-transparent" type="button" role="tab" aria-selected="false" data-filter="completed">완료됨</button>
          </div>

          <div class="todo-list mt-[17px] grid gap-2.5" id="todoList" aria-live="polite"></div>
          <div class="p-[46px_20px] text-center text-muted" id="emptyState" hidden>
            <span class="mb-[13px] block text-[27px] text-mint-deep" aria-hidden="true">✦</span>
            <h3 class="mb-[7px] font-display text-[19px] tracking-[-0.04em] text-ink" id="emptyTitle">아직 할 일이 없어요</h3>
            <p class="m-0 text-sm" id="emptyCopy">위 입력창에 오늘의 첫 할 일을 추가해보세요.</p>
          </div>
        </section>
      </main>

      <footer class="py-2 pb-[34px] text-center text-xs text-[#a0aaa4]">목록은 이 브라우저에 자동으로 저장됩니다.</footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>

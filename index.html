<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘의 할 일을 정리하고 진행률을 확인하는 To-Do 리스트">
  <title>오늘의 할 일</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div>
        <p class="eyebrow">DAILY RHYTHM</p>
        <h1>매일매일 한 걸음씩</h1>
      </div>
      <p class="date-label" id="todayLabel"></p>
    </header>

    <section class="progress-panel" aria-labelledby="progressHeading">
      <div class="progress-copy">
        <div>
          <p class="section-kicker">YOUR PROGRESS</p>
          <h2 id="progressHeading">차근차근, 오늘도 해내는 중</h2>
        </div>
        <p class="progress-count"><strong id="completedCount">0</strong><span>/ <span id="totalCount">0</span> 완료</span></p>
      </div>
      <div class="progress-track" role="progressbar" aria-label="할 일 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress-bar" id="progressBar"></span>
      </div>
    </section>

    <section class="todo-section" aria-labelledby="todoHeading">
      <div class="section-heading">
        <div>
          <p class="section-kicker">TASKS</p>
          <h2 id="todoHeading">할 일 목록</h2>
        </div>
        <span class="task-badge" id="visibleCount">0개</span>
      </div>

      <form class="add-form" id="todoForm">
        <label class="sr-only" for="todoInput">새 할 일</label>
        <input id="todoInput" name="todo" type="text" maxlength="120" placeholder="새로운 할 일을 적어보세요" autocomplete="off" required>
        <button type="submit" class="add-button" aria-label="할 일 추가"><span aria-hidden="true">+</span> 추가</button>
      </form>

      <nav class="filter-tabs" aria-label="할 일 필터">
        <button class="filter-tab is-active" type="button" data-filter="all" aria-current="page">전체 <span>0</span></button>
        <button class="filter-tab" type="button" data-filter="active">진행 중 <span>0</span></button>
        <button class="filter-tab" type="button" data-filter="completed">완료됨 <span>0</span></button>
      </nav>

      <div class="todo-list" id="todoList" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon" aria-hidden="true">✦</div>
        <h3 id="emptyTitle">아직 할 일이 없어요</h3>
        <p id="emptyDescription">작은 일부터 하나씩 시작해볼까요?</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
